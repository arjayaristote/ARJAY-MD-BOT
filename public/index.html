<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generateur de Session WhatsApp</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        .container {
            text-align: center;
            margin-top: 50px;
            padding: 20px;
        }
        .qr-code {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h1 class="text-primary">Générateur de Session WhatsApp</h1>
    <p class="text-muted">Entrez votre numéro WhatsApp pour générer un ID de session</p>
    <form id="session-form">
        <input type="text" id="phone-number" class="form-control mb-3" placeholder="Exemple: 255685880406" required>
        <button class="btn btn-primary" type="submit">Générer</button>
    </form>
    <div class="qr-code" id="qr-code">
        <h3>Scannez le QR Code ci-dessous :</h3>
        <img id="qr-img" src="#" alt="QR Code">
    </div>
</div>
<script>
    const form = document.getElementById('session-form');
    const qrCodeDiv = document.getElementById('qr-code');
    const qrImg = document.getElementById('qr-img');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        qrCodeDiv.style.display = 'none';
        const phoneNumber = document.getElementById('phone-number').value;

        try {
            const response = await fetch(`/generate-session`);
            const data = await response.json();

            if (data.qr) {
                qrImg.src = data.qr;
                qrCodeDiv.style.display = 'block';
            } else {
                alert('Échec de la génération du QR Code.');
            }
        } catch (error) {
            alert('Une erreur s\'est produite : ' + error.message);
        }
    });
</script>
</body>
</html>
