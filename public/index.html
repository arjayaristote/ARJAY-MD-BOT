<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARJAY MD | Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <style>
        body {
            background: linear-gradient(to bottom, #3b5998, #8b9dc3);
            color: white;
            font-family: 'Arial', sans-serif;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            padding-top: 50px;
            animation: fadeIn 2s;
        }
        .profile-pic {
            border-radius: 50%;
            width: 150px;
            border: 5px solid white;
        }
        .card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
            color: black;
        }
        h1 {
            margin-top: 15px;
            font-size: 2.2rem;
        }
        button {
            transition: all 0.3s ease;
        }
        button:hover {
            transform: scale(1.1);
            filter: brightness(1.2);
        }
    </style>
</head>
<body>
<div class="container">
    <img src="profile.jpg" class="profile-pic animate__animated animate__bounceIn" alt="ARJAY Profile">
    <h1 class="animate__animated animate__fadeInDown">Bienvenue chez ARJAY MD</h1>
    <p class="lead animate__animated animate__fadeInUp">Gérez vos sessions WhatsApp avec style 🚀</p>
    
    <div class="card p-4 mx-auto mt-4" style="max-width: 400px;">
        <form id="session-form">
            <input type="text" id="phone-number" class="form-control mb-3" placeholder="Numéro de téléphone (ex: +255685880406)" required>
            <button class="btn btn-primary w-100" type="submit">Générer une Session</button>
        </form>
        <div id="qr-wrapper" style="display: none;">
            <h4 class="mt-3">Votre QR Code :</h4>
            <img id="qr-code" src="#" alt="QR Code" class="img-fluid">
        </div>
    </div>
</div>

<script>
    const form = document.querySelector('#session-form');
    const qrWrapper = document.querySelector('#qr-wrapper');
    const qrCodeImg = document.querySelector('#qr-code');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const phoneNumber = document.querySelector('#phone-number').value;

        try {
            const response = await fetch(`/generate-session`);
            const data = await response.json();

            if (data.qr) {
                qrCodeImg.src = data.qr;
                qrWrapper.style.display = 'block';
            } else {
                alert('QR Code non généré. Réessayez plus tard.');
            }
        } catch (error) {
            alert('Erreur lors de la génération : ' + error.message);
        }
    });
</script>
</body>
</html>
